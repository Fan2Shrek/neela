framework:
    messenger:
        failure_transport: failed

        transports:
            # https://symfony.com/doc/current/messenger.html#transport-configuration
            # Self-hosted deployments pick their own transport via MESSENGER_TRANSPORT_DSN
            # (doctrine:// by default so no extra infra is required; amqp:// for RabbitMQ, etc.)
            async: '%env(MESSENGER_TRANSPORT_DSN)%'
            failed: 'doctrine://default?queue_name=failed'

        routing:
            # Every command in this app is dispatched async; nothing runs sync.
            App\Domain\Command\Project\ImportProjectCommand: async
            App\Domain\Command\Manifest\ScanManifestDependenciesCommand: async
            App\Domain\Command\Package\FetchAllPackageCommand: async
            App\Domain\Command\Package\GetPackageVersionCommand: async
            App\Domain\Command\Technology\RefreshTechnologySupportCommand: async

when@test:
    framework:
        messenger:
            transports:
                # For more Messenger testing tools, see https://github.com/zenstruck/messenger-test
                async: 'in-memory://'
                failed: 'in-memory://'
